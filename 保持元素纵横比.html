<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保持元素纵横比</title>
  <style>
    .aspect-ratio-box {
      width: 70%;
      height: 0;
      padding-bottom: 50%; /* 16:9 aspect ratio */
      background-color: lightblue;
    }
  </style>
</head>
<body>
  <div class="aspect-ratio-box">
    <!-- 这个 div 将保持 16:9 的纵横比 -->

  </div>
</body>
</html>

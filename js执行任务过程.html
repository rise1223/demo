<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>js执行任务过程</title>
</head>

<body>
  <!-- script1 是一个独立的宏任务 -->
  <!-- <script>
    console.log('1. script1 同步代码开始');

    // 创建一个微任务
    Promise.resolve().then(() => {
      console.log('2. script1 的微任务');
    });

    // 创建一个新的宏任务
    setTimeout(() => {
      console.log('3. script1 的宏任务 (setTimeout)');
    }, 0);

    console.log('4. script1 同步代码结束');
  </script> -->

  <!-- script2 是另一个独立的宏任务 -->
  <!-- <script>
    console.log('5. script2 同步代码开始');
    console.log('6. script2 同步代码结束');
  </script> -->
  <script>
    console.log('1');

    setTimeout(() => {
      console.log('2');

      Promise.resolve().then(() => {
        console.log('3');
      });
    }, 0);

    Promise.resolve().then(() => {
      console.log('4');
    });

    console.log('5');
  </script>
  <script>
    console.log('a1')

    setTimeout(() => {
      console.log('a2')

      Promise.resolve().then(() => {
        console.log('a3')
      })
    }, 0)

    Promise.resolve().then(() => {
      console.log('a4')
    })

    
  </script>
</body>

</html>

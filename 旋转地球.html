<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Rotating Earth with Three.js</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000;
        }
        canvas { 
            display: block; 
        }
        .info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 0 0 5px black;
            pointer-events: none; /* 不影响鼠标交互 */
        }
    </style>
</head>
<body>
    <div class="info">拖动鼠标旋转地球 | 滚轮缩放 | 双击重置视角</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 内嵌OrbitControls代码
        (function () {
            const OrbitControls = function (object, domElement) {
                domElement = (domElement !== undefined) ? domElement : document;

                // Set to false to disable this control
                this.enabled = true;

                // "target" sets the location of focus, where the object orbits around
                this.target = new THREE.Vector3();

                // How far you can dolly in and out ( PerspectiveCamera only )
                this.minDistance = 0;
                this.maxDistance = Infinity;

                // How far you can zoom in and out ( OrthographicCamera only )
                this.minZoom = 0;
                this.maxZoom = Infinity;

                // How far you can orbit vertically, upper and lower limits.
                // Range is 0 to Math.PI radians.
                this.minPolarAngle = 0; // radians
                this.maxPolarAngle = Math.PI; // radians

                // How far you can orbit horizontally, upper and lower limits.
                // If set, must be a sub-interval of the interval [ - Math.PI, Math.PI ].
                this.minAzimuthAngle = -Infinity; // radians
                this.maxAzimuthAngle = Infinity; // radians

                // Set to true to enable damping (inertia)
                // If damping is enabled, you must call controls.update() in your animation loop
                this.enableDamping = false;
                this.dampingFactor = 0.25;

                // This option actually enables dollying in and out; left as "zoom" for backwards compatibility.
                // Set to false to disable zooming
                this.enableZoom = true;
                this.zoomSpeed = 1.0;

                // Set to false to disable rotating
                this.enableRotate = true;
                this.rotateSpeed = 1.0;

                // Set to false to disable panning
                this.enablePan = true;
                this.keyPanSpeed = 7.0;	// pixels moved per arrow key push

                // Set to true to automatically rotate around the target
                // If auto-rotate is enabled, you must call controls.update() in your animation loop
                this.autoRotate = false;
                this.autoRotateSpeed = 2.0; // 30 seconds per round when fps is 60

                // Set to false to disable use of the keys
                this.enableKeys = true;
                // The four arrow keys
                this.keys = { LEFT: 37, UP: 38, RIGHT: 39, BOTTOM: 40 };
                // Mouse buttons
                this.mouseButtons = { ORBIT: THREE.MOUSE.LEFT, ZOOM: THREE.MOUSE.MIDDLE, PAN: THREE.MOUSE.RIGHT };

                // for reset
                this.target0 = this.target.clone();
                this.position0 = object.position.clone();
                this.zoom0 = object.zoom;

                //
                // public methods
                //

                this.getPolarAngle = function () {
                    return spherical.phi;
                };

                this.getAzimuthalAngle = function () {
                    return spherical.theta;
                };

                this.saveState = function () {
                    scope.target0.copy(scope.target);
                    scope.position0.copy(object.position);
                    scope.zoom0 = object.zoom;
                };

                this.reset = function () {
                    scope.target.copy(scope.target0);
                    object.position.copy(scope.position0);
                    object.zoom = scope.zoom0;

                    object.updateProjectionMatrix();
                    scope.dispatchEvent(changeEvent);

                    scope.update();

                    state = STATE.NONE;
                };

                // this method is exposed, but perhaps it would be better if we can make it private...
                this.update = function () {
                    const offset = new THREE.Vector3();

                    // so camera.up is the orbit axis
                    const quat = new THREE.Quaternion().setFromUnitVectors(object.up, new THREE.Vector3(0, 1, 0));
                    const quatInverse = quat.clone().inverse();

                    const lastPosition = new THREE.Vector3();
                    const lastQuaternion = new THREE.Quaternion();

                    return function update() {
                        const position = object.position;

                        offset.copy(position).sub(scope.target);

                        // rotate offset to "y-axis-is-up" space
                        offset.applyQuaternion(quat);

                        // angle from z-axis around y-axis
                        spherical.setFromVector3(offset);

                        if (scope.autoRotate && state === STATE.NONE) {
                            rotateLeft(getAutoRotationAngle());
                        }

                        spherical.theta += sphericalDelta.theta;
                        spherical.phi += sphericalDelta.phi;

                        // restrict theta to be between desired limits
                        spherical.theta = Math.max(scope.minAzimuthAngle, Math.min(scope.maxAzimuthAngle, spherical.theta));

                        // restrict phi to be between desired limits
                        spherical.phi = Math.max(scope.minPolarAngle, Math.min(scope.maxPolarAngle, spherical.phi));

                        spherical.makeSafe();


                        spherical.radius *= scale;

                        // restrict radius to be between desired limits
                        spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius));

                        // move target to panned location
                        scope.target.add(panOffset);

                        offset.setFromSpherical(spherical);

                        // rotate offset back to "camera-up-vector-is-up" space
                        offset.applyQuaternion(quatInverse);

                        position.copy(scope.target).add(offset);

                        object.lookAt(scope.target);

                        if (scope.enableDamping === true) {
                            sphericalDelta.theta *= (1 - scope.dampingFactor);
                            sphericalDelta.phi *= (1 - scope.dampingFactor);

                            panOffset.multiplyScalar(1 - scope.dampingFactor);

                        } else {
                            sphericalDelta.set(0, 0, 0);

                            panOffset.set(0, 0, 0);

                        }

                        scale = 1;

                        // update condition is:
                        // min(camera displacement, camera rotation in radians)^2 > EPS
                        // using small-angle approximation cos(x/2) = 1 - x^2 / 8

                        if (zoomChanged ||
                            lastPosition.distanceToSquared(object.position) > EPS ||
                            8 * (1 - lastQuaternion.dot(object.quaternion)) > EPS) {

                            scope.dispatchEvent(changeEvent);

                            lastPosition.copy(object.position);
                            lastQuaternion.copy(object.quaternion);
                            zoomChanged = false;

                            return true;

                        }

                        return false;
                    };
                }();

                this.dispose = function () {
                    domElement.removeEventListener('contextmenu', onContextMenu, false);
                    domElement.removeEventListener('mousedown', onMouseDown, false);
                    domElement.removeEventListener('wheel', onMouseWheel, false);

                    domElement.removeEventListener('touchstart', onTouchStart, false);
                    domElement.removeEventListener('touchend', onTouchEnd, false);
                    domElement.removeEventListener('touchmove', onTouchMove, false);

                    document.removeEventListener('mousemove', onMouseMove, false);
                    document.removeEventListener('mouseup', onMouseUp, false);

                    window.removeEventListener('keydown', onKeyDown, false);

                    //scope.dispatchEvent( { type: 'dispose' } ); // should this be added here?
                };

                //
                // internals
                //

                const scope = this;

                const changeEvent = { type: 'change' };
                const startEvent = { type: 'start' };
                const endEvent = { type: 'end' };

                const STATE = { NONE: -1, ROTATE: 0, DOLLY: 1, PAN: 2, TOUCH_ROTATE: 3, TOUCH_DOLLY: 4, TOUCH_PAN: 5 };

                let state = STATE.NONE;

                const EPS = 0.000001;

                // current position in spherical coordinates
                const spherical = new THREE.Spherical();
                const sphericalDelta = new THREE.Spherical();

                let scale = 1;
                const panOffset = new THREE.Vector3();
                let zoomChanged = false;

                const rotateStart = new THREE.Vector2();
                const rotateEnd = new THREE.Vector2();
                const rotateDelta = new THREE.Vector2();

                const panStart = new THREE.Vector2();
                const panEnd = new THREE.Vector2();
                const panDelta = new THREE.Vector2();

                const dollyStart = new THREE.Vector2();
                const dollyEnd = new THREE.Vector2();
                const dollyDelta = new THREE.Vector2();

                function getAutoRotationAngle() {
                    return 2 * Math.PI / 60 / 60 * scope.autoRotateSpeed;
                }

                function getZoomScale() {
                    return Math.pow(0.95, scope.zoomSpeed);
                }

                function rotateLeft(angle) {
                    sphericalDelta.theta -= angle;
                }

                function rotateUp(angle) {
                    sphericalDelta.phi -= angle;
                }

                const panLeft = function () {
                    const v = new THREE.Vector3();

                    return function panLeft(distance, objectMatrix) {
                        v.setFromMatrixColumn(objectMatrix, 0); // get X column of objectMatrix
                        v.multiplyScalar(-distance);

                        panOffset.add(v);
                    };
                }();

                const panUp = function () {
                    const v = new THREE.Vector3();

                    return function panUp(distance, objectMatrix) {
                        if (scope.screenSpacePanning === true) {
                            v.setFromMatrixColumn(objectMatrix, 1);
                        } else {
                            v.setFromMatrixColumn(objectMatrix, 0);
                            v.crossVectors(object.up, v);
                        }

                        v.multiplyScalar(distance);

                        panOffset.add(v);
                    };
                }();

                // deltaX and deltaY are in pixels; right and down are positive
                const pan = function () {
                    const offset = new THREE.Vector3();

                    return function pan(deltaX, deltaY) {
                        // 修复：确保 domElement 存在且有 clientHeight 属性
                        const element = scope.domElement === document ? document.documentElement : scope.domElement;
                        
                        if (!element || !element.clientHeight) {
                            // 如果无法获取元素高度，使用默认值
                            console.warn('Could not determine element dimensions for panning');
                            return;
                        }

                        if (object.isPerspectiveCamera) {
                            // perspective
                            const position = object.position;
                            offset.copy(position).sub(scope.target);
                            let targetDistance = offset.length();

                            // half of the fov is center to top of screen
                            targetDistance *= Math.tan((object.fov / 2) * Math.PI / 180.0);

                            // we use only clientHeight here so aspect ratio does not distort speed
                            panLeft(2 * deltaX * targetDistance / element.clientHeight, object.matrix);
                            panUp(2 * deltaY * targetDistance / element.clientHeight, object.matrix);

                        } else if (object.isOrthographicCamera) {
                            // orthographic
                            panLeft(deltaX * (object.right - object.left) / element.clientWidth, object.matrix);
                            panUp(deltaY * (object.top - object.bottom) / element.clientHeight, object.matrix);

                        } else {
                            // camera neither orthographic nor perspective
                            console.warn('WARNING: OrbitControls encountered an unknown camera type - pan disabled.');
                            scope.enablePan = false;
                        }
                    };
                }();

                function dollyIn(dollyScale) {
                    if (object.isPerspectiveCamera) {
                        scale /= dollyScale;
                    } else if (object.isOrthographicCamera) {
                        object.zoom = Math.max(scope.minZoom, Math.min(scope.maxZoom, object.zoom * dollyScale));
                        object.updateProjectionMatrix();
                        zoomChanged = true;
                    } else {
                        console.warn('WARNING: OrbitControls encountered an unknown camera type - dolly/zoom disabled.');
                        scope.enableZoom = false;
                    }
                }

                function dollyOut(dollyScale) {
                    if (object.isPerspectiveCamera) {
                        scale *= dollyScale;
                    } else if (object.isOrthographicCamera) {
                        object.zoom = Math.max(scope.minZoom, Math.min(scope.maxZoom, object.zoom / dollyScale));
                        object.updateProjectionMatrix();
                        zoomChanged = true;
                    } else {
                        console.warn('WARNING: OrbitControls encountered an unknown camera type - dolly/zoom disabled.');
                        scope.enableZoom = false;
                    }
                }

                //
                // event callbacks - update the object state
                //

                function handleMouseDownRotate(event) {
                    rotateStart.set(event.clientX, event.clientY);
                }

                function handleMouseDownDolly(event) {
                    dollyStart.set(event.clientX, event.clientY);
                }

                function handleMouseDownPan(event) {
                    panStart.set(event.clientX, event.clientY);
                }

                function handleMouseMoveRotate(event) {
                    rotateEnd.set(event.clientX, event.clientY);
                    rotateDelta.subVectors(rotateEnd, rotateStart).multiplyScalar(scope.rotateSpeed);

                    const element = scope.domElement === document ? document.documentElement : scope.domElement;

                    if (!element || !element.clientHeight) {
                        console.warn('Could not determine element dimensions for rotation');
                        return;
                    }

                    rotateLeft(2 * Math.PI * rotateDelta.x / element.clientHeight); // yes, height
                    rotateUp(2 * Math.PI * rotateDelta.y / element.clientHeight);

                    rotateStart.copy(rotateEnd);

                    scope.update();
                }

                function handleMouseMoveDolly(event) {
                    dollyEnd.set(event.clientX, event.clientY);

                    dollyDelta.subVectors(dollyEnd, dollyStart);

                    if (dollyDelta.y > 0) {
                        dollyIn(getZoomScale());
                    } else if (dollyDelta.y < 0) {
                        dollyOut(getZoomScale());
                    }

                    dollyStart.copy(dollyEnd);

                    scope.update();
                }

                function handleMouseMovePan(event) {
                    panEnd.set(event.clientX, event.clientY);

                    panDelta.subVectors(panEnd, panStart).multiplyScalar(scope.panSpeed);

                    pan(panDelta.x, panDelta.y);

                    panStart.copy(panEnd);

                    scope.update();
                }

                function handleMouseUp(/*event*/) {
                    // no-op
                }

                function handleMouseWheel(event) {
                    if (event.deltaY < 0) {
                        dollyOut(getZoomScale());
                    } else if (event.deltaY > 0) {
                        dollyIn(getZoomScale());
                    }

                    scope.update();
                }

                function handleKeyDown(event) {
                    let needsUpdate = false;

                    switch (event.keyCode) {
                        case scope.keys.UP:
                            pan(0, scope.keyPanSpeed);
                            needsUpdate = true;
                            break;
                        case scope.keys.BOTTOM:
                            pan(0, -scope.keyPanSpeed);
                            needsUpdate = true;
                            break;
                        case scope.keys.LEFT:
                            pan(scope.keyPanSpeed, 0);
                            needsUpdate = true;
                            break;
                        case scope.keys.RIGHT:
                            pan(-scope.keyPanSpeed, 0);
                            needsUpdate = true;
                            break;
                    }

                    if (needsUpdate) {
                        // prevent the browser from scrolling on cursor keys
                        event.preventDefault();

                        scope.update();
                    }
                }

                function handleTouchStartRotate(event) {
                    if (event.touches.length == 1) {
                        rotateStart.set(event.touches[0].pageX, event.touches[0].pageY);
                    } else {
                        const x = 0.5 * (event.touches[0].pageX + event.touches[1].pageX);
                        const y = 0.5 * (event.touches[0].pageY + event.touches[1].pageY);

                        rotateStart.set(x, y);
                    }
                }

                function handleTouchStartDolly(event) {
                    const dx = event.touches[0].pageX - event.touches[1].pageX;
                    const dy = event.touches[0].pageY - event.touches[1].pageY;

                    const distance = Math.sqrt(dx * dx + dy * dy);

                    dollyStart.set(0, distance);
                }

                function handleTouchStartPan(event) {
                    if (event.touches.length == 1) {
                        panStart.set(event.touches[0].pageX, event.touches[0].pageY);
                    } else {
                        const x = 0.5 * (event.touches[0].pageX + event.touches[1].pageX);
                        const y = 0.5 * (event.touches[0].pageY + event.touches[1].pageY);

                        panStart.set(x, y);
                    }
                }

                function handleTouchMoveRotate(event) {
                    let position;

                    if (event.touches.length == 1) {
                        position = {
                            x: event.touches[0].pageX,
                            y: event.touches[0].pageY
                        };
                    } else {
                        const x = 0.5 * (event.touches[0].pageX + event.touches[1].pageX);
                        const y = 0.5 * (event.touches[0].pageY + event.touches[1].pageY);

                        position = {
                            x: x,
                            y: y
                        };
                    }

                    rotateEnd.set(position.x, position.y);
                    rotateDelta.subVectors(rotateEnd, rotateStart).multiplyScalar(scope.rotateSpeed);

                    const element = scope.domElement === document ? document.documentElement : scope.domElement;

                    if (!element || !element.clientHeight) {
                        console.warn('Could not determine element dimensions for rotation');
                        return;
                    }

                    rotateLeft(2 * Math.PI * rotateDelta.x / element.clientHeight); // yes, height
                    rotateUp(2 * Math.PI * rotateDelta.y / element.clientHeight);

                    rotateStart.copy(rotateEnd);

                    scope.update();
                }

                function handleTouchMoveDolly(event) {
                    const dx = event.touches[0].pageX - event.touches[1].pageX;
                    const dy = event.touches[0].pageY - event.touches[1].pageY;

                    const distance = Math.sqrt(dx * dx + dy * dy);

                    dollyEnd.set(0, distance);

                    dollyDelta.set(0, Math.pow(dollyEnd.y / dollyStart.y, scope.zoomSpeed));

                    dollyIn(dollyDelta.y);

                    dollyStart.copy(dollyEnd);

                    scope.update();
                }

                function handleTouchMovePan(event) {
                    let position;

                    if (event.touches.length == 1) {
                        position = {
                            x: event.touches[0].pageX,
                            y: event.touches[0].pageY
                        };
                    } else {
                        const x = 0.5 * (event.touches[0].pageX + event.touches[1].pageX);
                        const y = 0.5 * (event.touches[0].pageY + event.touches[1].pageY);

                        position = {
                            x: x,
                            y: y
                        };
                    }

                    panEnd.set(position.x, position.y);

                    panDelta.subVectors(panEnd, panStart).multiplyScalar(scope.panSpeed);

                    pan(panDelta.x, panDelta.y);

                    panStart.copy(panEnd);

                    scope.update();
                }

                function handleTouchEnd(/*event*/) {
                    // no-op
                }

                //
                // event handlers - FSM: listen for events and reset state
                //

                function onMouseDown(event) {
                    if (scope.enabled === false) return;

                    event.preventDefault();

                    switch (event.button) {
                        case scope.mouseButtons.ORBIT:
                            if (scope.enableRotate === false) return;
                            handleMouseDownRotate(event);
                            state = STATE.ROTATE;
                            break;
                        case scope.mouseButtons.ZOOM:
                            if (scope.enableZoom === false) return;
                            handleMouseDownDolly(event);
                            state = STATE.DOLLY;
                            break;
                        case scope.mouseButtons.PAN:
                            if (scope.enablePan === false) return;
                            handleMouseDownPan(event);
                            state = STATE.PAN;
                            break;
                    }

                    if (state !== STATE.NONE) {
                        document.addEventListener('mousemove', onMouseMove, false);
                        document.addEventListener('mouseup', onMouseUp, false);

                        scope.dispatchEvent(startEvent);
                    }
                }

                function onMouseMove(event) {
                    if (scope.enabled === false) return;

                    event.preventDefault();

                    switch (state) {
                        case STATE.ROTATE:
                            if (scope.enableRotate === false) return;
                            handleMouseMoveRotate(event);
                            break;
                        case STATE.DOLLY:
                            if (scope.enableZoom === false) return;
                            handleMouseMoveDolly(event);
                            break;
                        case STATE.PAN:
                            if (scope.enablePan === false) return;
                            handleMouseMovePan(event);
                            break;
                    }
                }

                function onMouseUp(event) {
                    if (scope.enabled === false) return;

                    handleMouseUp(event);

                    document.removeEventListener('mousemove', onMouseMove, false);
                    document.removeEventListener('mouseup', onMouseUp, false);

                    scope.dispatchEvent(endEvent);

                    state = STATE.NONE;
                }

                function onMouseWheel(event) {
                    if (scope.enabled === false || scope.enableZoom === false || (state !== STATE.NONE && state !== STATE.ROTATE)) return;

                    event.preventDefault();
                    event.stopPropagation();

                    scope.dispatchEvent(startEvent);

                    handleMouseWheel(event);

                    scope.dispatchEvent(endEvent);
                }

                function onKeyDown(event) {
                    if (scope.enabled === false || scope.enableKeys === false || scope.enablePan === false) return;

                    handleKeyDown(event);
                }

                function onTouchStart(event) {
                    if (scope.enabled === false) return;

                    switch (event.touches.length) {
                        case 1:	// one-fingered touch: rotate
                            if (scope.enableRotate === false) return;
                            handleTouchStartRotate(event);
                            state = STATE.TOUCH_ROTATE;
                            break;
                        case 2:	// two-fingered touch: dolly
                            if (scope.enableZoom === false) return;
                            handleTouchStartDolly(event);
                            state = STATE.TOUCH_DOLLY;
                            break;
                        case 3: // three-fingered touch: pan
                            if (scope.enablePan === false) return;
                            handleTouchStartPan(event);
                            state = STATE.TOUCH_PAN;
                            break;
                        default:
                            state = STATE.NONE;
                    }

                    if (state !== STATE.NONE) {
                        scope.dispatchEvent(startEvent);
                    }
                }

                function onTouchMove(event) {
                    if (scope.enabled === false) return;

                    event.preventDefault();
                    event.stopPropagation();

                    switch (event.touches.length) {
                        case 1: // one-fingered touch: rotate
                            if (scope.enableRotate === false) return;
                            if (state !== STATE.TOUCH_ROTATE) return; // is this needed?...
                            handleTouchMoveRotate(event);
                            break;
                        case 2: // two-fingered touch: dolly
                            if (scope.enableZoom === false) return;
                            if (state !== STATE.TOUCH_DOLLY) return; // is this needed?...
                            handleTouchMoveDolly(event);
                            break;
                        case 3: // three-fingered touch: pan
                            if (scope.enablePan === false) return;
                            if (state !== STATE.TOUCH_PAN) return; // is this needed?...
                            handleTouchMovePan(event);
                            break;
                        default:
                            state = STATE.NONE;
                    }
                }

                function onTouchEnd(event) {
                    if (scope.enabled === false) return;

                    handleTouchEnd(event);

                    scope.dispatchEvent(endEvent);

                    state = STATE.NONE;
                }

                function onContextMenu(event) {
                    if (scope.enabled === false) return;

                    event.preventDefault();
                }

                // add DOM listeners
                domElement.addEventListener('contextmenu', onContextMenu, false);
                domElement.addEventListener('mousedown', onMouseDown, false);
                domElement.addEventListener('wheel', onMouseWheel, false);

                domElement.addEventListener('touchstart', onTouchStart, false);
                domElement.addEventListener('touchend', onTouchEnd, false);
                domElement.addEventListener('touchmove', onTouchMove, false);

                window.addEventListener('keydown', onKeyDown, false);

                // force an update at start
                this.update();
            };

            OrbitControls.prototype = Object.create(THREE.EventDispatcher.prototype);
            OrbitControls.prototype.constructor = OrbitControls;

            // Assign to global scope
            THREE.OrbitControls = OrbitControls;
        })();
        
        // 初始化场景、相机和渲染器
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 创建地球几何体
        const earthGeometry = new THREE.SphereGeometry(2, 64, 64);

        // 加载地球纹理（使用免费的NASA地球纹理）
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
        const earthBumpMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
        const earthSpecularMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');

        // 创建地球材质
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            bumpMap: earthBumpMap,
            bumpScale: 0.05,
            specularMap: earthSpecularMap,
            specular: new THREE.Color('grey'),
            shininess: 5
        });

        // 创建地球网格
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // 添加云层
        const cloudGeometry = new THREE.SphereGeometry(2.05, 64, 64);
        const cloudTexture = textureLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_2048.png');
        const cloudMaterial = new THREE.MeshPhongMaterial({
            map: cloudTexture,
            transparent: true,
            opacity: 0.8
        });
        const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
        scene.add(clouds);

        // 添加星空背景
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({
            color: 0xFFFFFF,
            size: 0.1,
        });

        const starVertices = [];
        for (let i = 0; i < 10000; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            starVertices.push(x, y, z);
        }

        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // 添加环境光和太阳光
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xFFFFFF, 1);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        // 设置相机位置
        camera.position.z = 5;

        // 初始化OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 启用阻尼效果，使旋转更平滑
        controls.dampingFactor = 0.05;  // 阻尼系数
        controls.rotateSpeed = 0.8;     // 旋转速度
        controls.zoomSpeed = 1.2;       // 缩放速度
        controls.panSpeed = 0.5;        // 平移速度
        
        // 限制缩放范围
        controls.minDistance = 3;
        controls.maxDistance = 10;

        // 限制垂直旋转角度（防止翻转）
        controls.minPolarAngle = Math.PI/4; // 上限
        controls.maxPolarAngle = Math.PI - Math.PI/4; // 下限

        // 处理窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新控制器状态（如果启用了阻尼）
            controls.update();
            
            // 在没有用户交互时继续自动旋转
            earth.rotation.y += 0.001;
            clouds.rotation.y += 0.0015;
            
            renderer.render(scene, camera);
        }

        // 监听双击事件重置视角
        renderer.domElement.addEventListener('dblclick', () => {
            // 重置相机位置和旋转
            camera.position.set(0, 0, 5);
            camera.lookAt(0, 0, 0);
            controls.reset(); // 重置控制器状态
        });
        animate();
    </script>
</body>
</html>
